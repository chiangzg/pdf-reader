# CI：push / PR 时跑前端构建（含 tsc 类型检查）与后端依赖安装 + 导入检查。
# 项目暂无测试与 lint，先守住"能装、能导入、能构建"的底线，后续补测试时在此追加步骤。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端构建（tsc + vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建（tsc -b && vite build）
        run: npm run build

  backend:
    name: 后端检查（依赖安装 + 导入）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 导入检查（app.main 可导入即路由/模型/配置无误）
        run: python -c "from app.main import app; print('routes:', len(app.routes))"
